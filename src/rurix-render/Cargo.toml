[package]
name = "rurix-render"
description = "Rurix 原生引擎渲染器库(G5,RFC-0016,渲染器调研七报告 P0–P2 主线)——声明式 render graph(逐 pass 读写声明 + EB 三轴屏障推导 + transient 池化别名 + 编译期校验 + 异步 compute 车道)/ 虚拟化几何(GPU 两级剔除 + 64 位 VisBuffer SW/HW 双路光栅 + 材质 classify-resolve)/ VSM clipmap 阴影 / 屏幕探针 GI / AS 管理 + ray query 效果 / 单层材质闭合 + GPU scene + PSO precache + 页式流送 / 时域重建(MV/TAA/TSR/UpscaleBackend)。渲染器是库不进语言(06 §8.3);host 侧全 safe 纯 Rust 可单测(uc04-demo 先例),device 执行经 rurix-rt vk 底座(feature vulkan gate)"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# device 执行底座(可选):rurix-rt vk 执行器 + graph 双后端映射。host 逻辑(图编译/
# 屏障推导/transient/几何/时域数学/页表)零外部依赖、default 不拉 GPU 面。
rurix-rt = { path = "../rurix-rt", optional = true }
# M25 ABI hash 与 M31 同源 SHA-256(rurix-pkg)。
rurix-pkg = { path = "../rurix-pkg" }
# G9.4 M97(RXS-0358):Card 图集页复用 M91 RXPL v2 页 ABI(encode/decode 冻结面
# 直接消费,禁私定磁盘格式;workspace path 依赖,零外部 crate)。
rurix-geom-pages = { path = "../rurix-geom-pages" }

[features]
default = []
# vulkan:device 执行腿(经 rurix-rt vk 底座真派发)。默认关闭:无 Vulkan SDK 环境
# `cargo build --workspace` 仍全绿(uc04-demo real-shim 先例,host 逻辑常驻回归网)。
vulkan = ["dep:rurix-rt", "rurix-rt/vulkan"]

[[bin]]
name = "g8_m19_probe"
path = "src/bin/g8_m19_probe.rs"

[[bin]]
name = "g8_m25_probe"
path = "src/bin/g8_m25_probe.rs"

# G9.3 M92 GPU 蒙皮 device 对拍 harness(RXS-0353;门 g9.p1.m92.gpu_skinning_lod_update):
# 手编 SPV 蒙皮 compute kernel(geometry/skin_kernel.rs)经 rurix-rt render_exec 真跑,
# 与 host Kerbl 参照逐顶点容差 0 对拍 + 包围球/法向锥包含核验 + RED 臂。
[[bin]]
name = "g9_m92_skinning_device"
path = "src/bin/g9_m92_skinning_device.rs"
required-features = ["vulkan"]

# G9.3 M95 蒙皮簇 VisBuffer SW/HW diff=0 device 双腿 harness(RXS-0352 L2):
# SW 精确 compute 腿 vs HW 保守光栅腿(render_exec;G7.5b RXS-0303 体例)u64 位级 diff=0。
[[bin]]
name = "g9_m95_visbuffer_swhw"
path = "src/bin/g9_m95_visbuffer_swhw.rs"
required-features = ["vulkan"]

# G9.4 M96 M17 Path Tracer 参照器 device harness(RXS-0357;门 g9.p0.m96.path_tracer_reference):
# .rx megakernel(kernels/g9_m96_path_tracer.rx,rurixc --target vulkan 产 SPV)经
# run_ray_query_effects(U30 ray query 执行面)真跑;固定 seed 双跑位级一致 +
# pbrt-v4 容差带对照 + 改 seed/跳 RR/关 MIS 三臂 RED。
[[bin]]
name = "g9_m96_path_tracer"
path = "src/bin/g9_m96_path_tracer.rs"
required-features = ["vulkan"]

# G9.4 M97 Surface Cache device harness(RXS-0358;门 g9.p0.m97.surface_cache):
# 离线 Card 参数化(≤12/mesh 可配 fail-closed)+ RXPL v2 图集页打包(复用 M91
# 冻结 ABI)经 gi::surface_cache host 面;capture/render 两 .rx kernel
# (kernels/g9_m97_cache_{capture,render}.rx,rurixc --target vulkan 产 SPV)经
# run_ray_query_effects(U30 ray query 执行面)真跑;三深度对 M96 golden 容差带
# (measured 冻结)+ Card 空洞漏光 RED 臂 + 只丢能量不漏光断言。
[[bin]]
name = "g9_m97_surface_cache"
path = "src/bin/g9_m97_surface_cache.rs"
required-features = ["vulkan"]

[lints]
workspace = true
