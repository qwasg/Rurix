# run_ray_query_effects)真跑;四档 L0~L3 共享内核单实例断言 + 每档 AS 预算行
# 消费 AsStats + 超预算强制降档显式记录(静默降档注入必拒)+ SRGB 编码注入
# RED 臂 + 匹配深度 2 对 M96 golden 容差带(measured 冻结)。
[[bin]]
name = "g9_m101_if_tier_ladder"
path = "src/bin/g9_m101_if_tier_ladder.rs"
