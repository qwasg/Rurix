# 面(无 device 依赖,故无 required-features)。
[[bin]]
name = "g19_frame_gen_probe"
path = "src/bin/g19_frame_gen_probe.rs"

# G20.2 M-a HZB 遮挡剔除 host 参考臂 probe(RFC-0037;门
# g20.p0.m_a.hzb_occlusion_host_realization):geometry/hzb 保守零假阳性硬
# 不变量(800 rect 夹具 vs 逐像素精确真值)+ 剔除率非零 + 双跑位级 digest,
# reverse-Z/standard-Z 双约定非 2 幂 193×117。纯 host 确定性面。
[[bin]]
name = "g20_hzb_probe"
path = "src/bin/g20_hzb_probe.rs"

# G21.2 M-a ReSTIR 高档 reservoir host 参考臂 probe(RFC-0038;门
# g21.p0.m_a.restir_high_reservoir_realization):gi/restir_reservoir 64 灯夹具
# 20k trial 三估计子无偏 3σ + 等验证预算方差收益 measured + 双跑位级。
# 纯 host 确定性面。
[[bin]]
name = "g21_restir_probe"
path = "src/bin/g21_restir_probe.rs"

# G22.2 M-a slab 材质能量守恒 host 参考臂 probe(RFC-0039;门
# g22.p0.m_a.slab_material_host_realization):material/slab 128×128 参数网格
# 白炉审计(白炉恒等/能量上界/单调/闭式↔级数+尾和恒等式/lerp 连续)+ 双跑
# 位级。纯 host 确定性面。
[[bin]]
name = "g22_slab_probe"
path = "src/bin/g22_slab_probe.rs"

# G26.2 M-a/M-b FG/MFG device kernel harness(RFC-0043 §1/§2;门
# g26.p0.m_a.framegen_device_kernel + g26.p0.m_b.framegen_device_bench_accounting):
# .rx kernel(kernels/g26_framegen.rx,rurixc --target vulkan 产 SPV + spirv-val
# 通过,G12/G13 vk::run_compute 车道复用)公式面与 host 金标准
# temporal::framegen::interpolate 逐字同源(temporal/ 整目录 0-byte 冻结)——
# 恒速平移合成场景 ×2/×3/×4 三档 device vs host 逐帧对拍(容差标定程序产禁
# 手写)+ SSIM 程序产对照(interp > frame-hold)+ device 双跑位级 + RED 臂
# (kernel-bias/seed-change)+ bench 腿(warmup+timed 逐帧墙钟 + FgAccounting
# 两口径类型面核验,回归守护语义不构成帧率对标通过线)。
[[bin]]
name = "g26_framegen_device"
path = "src/bin/g26_framegen_device.rs"
required-features = ["vulkan"]

