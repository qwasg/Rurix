[package]
name = "rurix-physics"
description = "Rurix 引擎物理库(G6.2,RFC-0017 §4.A)——Jolt 生产默认后端(固定步/睡眠/批插体/CCD/job 接宿主池)/ 查询面(ray·shape cast·overlap,step 外并发,规范序确定性)/ 接触事件面(Begin·Persist·End 有界 ring,归一化序列)/ SyncBudget 每帧重置。对外全 safe(`forbid(unsafe_code)`),BodyId/ShapeId 不透明句柄(index32+generation32);物理为引擎库不进语言(06 §8.3)"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Jolt 生产默认后端构建 gate(非功能面开关,RFC-0017 §4.0-7):默认 on,经
# rurix-physics-sys vendor 构建 JoltC;`--no-default-features` 零 C++ 依赖恒绿,
# `PhysicsWorld::new(Jolt)` → 确定性 Err(BackendNotCompiled,P-01 不静默回退)。
rurix-physics-sys = { path = "../rurix-physics-sys", optional = true }
# G9.6 M125 Jolt 5.6 评估后端(RXS-0377 七步程序第②步;feature `jolt56` 默认 off):
# 经 rurix-physics-sys56 独立 vendor 线(JoltC@2982004 + JoltPhysics v5.6.0,
# JPC56_/JPH56 符号隔离)与 5.3 基线并存同进程;评估用途不升格生产默认。
rurix-physics-sys56 = { path = "../rurix-physics-sys56", optional = true }
# G6.3 渲染合流桥(RFC-0017 §4.B):bridge 取 GpuScene 类型面——依赖方向裁决 =
# rurix-physics → rurix-render 单向(rurix-render 永不依赖 physics,§4.B1-1);
# 仅消费 host 侧类型面(GpuScene 变换写口 + DirtyRange),不启用 render 的
# device feature(vulkan 默认 off);后端无关,`--no-default-features` 档同编译。
rurix-render = { path = "../rurix-render" }
# M66 capture semantic_state_hash(RFC-0021 §4.A1):复用 M31 先例手写 SHA-256。
rurix-pkg = { path = "../rurix-pkg", optional = true }
# Rapier 快路径第二后端(G6.4,RFC-0017 §4.D):纯 Rust 零 CMake,经 feature
# `rapier` 启用(默认 off);消费收敛于 src/rapier.rs 单模块(§4.C4 grep
# 判据 v1.4 收窄),crate 维持 forbid(unsafe_code)。feature 面(RFC 修订
# 记录 v1.4 留痕):§4.D1「default-features = false」原意 = 无 CMake/无
# parallel·simd·serde,但 rapier3d 0.33 lib required-features = dim3+f32
# 且 math/parry 依赖链需 std 启用(零 feature 字面不可编译,84 E0432),
# 故显式启用最小集 dim3/f32/std——parallel/simd-stable/serde-serialize/
# enhanced-determinism 维持 off。
rapier3d = { version = "=0.33.0", default-features = false, features = ["dim3", "f32", "std"], optional = true }

[features]
default = ["jolt"]
jolt = ["dep:rurix-physics-sys"]
# jolt56:G9.6 M125 Jolt 5.6 评估后端(默认 off,cargo metadata 可机验;与 5.3
# 基线并存不覆盖;评估臂不升格生产默认,RXS-0377 L6 两臂诚实登记)。
jolt56 = ["dep:rurix-physics-sys56"]
# physics-capture:M66 capture/replay(RFC-0021 §6.2 冻结名);依赖 jolt + sha256。
physics-capture = ["jolt", "dep:rurix-pkg"]
# network-physics:M67 history/rollback/correction/event dedup/smoothing(RFC-0021 §6.2)。
network-physics = ["physics-capture"]
# physics-character:M71 CharacterVirtual + M69 PhysicsAsset 产品层(RFC-0021 §6.2)。
physics-character = ["physics-capture"]
# physics-destruction:M68 cooked graph/cache/VFX event(RFC-0021 §6.2 冻结名)。
physics-destruction = ["physics-capture"]
# physics-cloth:M72 CPU XPBD cloth(RFC-0021 §6.2 冻结名)。
physics-cloth = ["physics-capture", "network-physics"]
# physics-vehicle:M70 自研悬挂载具(RFC-0021 §6.2 冻结名)。
physics-vehicle = ["physics-capture"]
# physics-particle-view:G9.2 M121 统一 particle view 五域 adapter +
# 名义类型 + M68 damage journal 迁移器(RFC-0024 §4.A;骨架期;
# cloth/ragdoll/character/destruction 四域 adapter 随各自 feature 编译)。
physics-particle-view = ["physics-capture"]
# physics-field:G9.2 M122 Gameplay Field(RFC-0024 §4.B,R-3/R-7 🔒 冻结名;
# 名称即日冻结,改名须修订行);作用对象层消费 M121 particle view。
physics-field = ["physics-particle-view", "physics-cloth", "physics-destruction", "physics-character"]
# physics-buoyancy:G9.6 M124 解析浮力走 Field 通道(RFC-0024 §4.D + R-7 🔒
# 冻结名;名称即日冻结,改名须修订行);spec/physics.md RXS-0376:功能未编译
# 时返回 FeatureNotCompiled 类错误,不静默退化成视觉-only 成功。
physics-buoyancy = ["physics-field"]
# rapier:G6.4 快路径第二后端(默认 off,cargo metadata 可机验;G-G6-5)。
# 纯 Rust 零 CMake(default-features = false,=0.33.0 pin,RFC-0017 §4.D1
# 调研锚 2026-07-31);「快路径 ≠ 性能/稳定性默认」(§4.D4)。
rapier = ["dep:rapier3d"]

[lints]
workspace = true
